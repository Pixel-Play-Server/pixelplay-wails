name: Desktop release builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin/arm64
            artifact: mac-arm64
          - runner: macos-15-intel
            platform: darwin/amd64
            artifact: mac-intel
          - runner: windows-2022
            platform: windows/amd64
            artifact: windows-x86_64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Pixel-Play-Server/pixelplaylauncher
          ref: 6f7b6eec00191a19a58c4681da489c8a55345814
          path: _ui
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: pixelplay-launcher/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pixelplay-launcher/frontend/package-lock.json
      - name: Prepare UI
        run: |
          cp -R _ui/src pixelplay-launcher/frontend/src
          cp -R _ui/public pixelplay-launcher/frontend/public
          npm ci --prefix pixelplay-launcher/frontend
          npm run build --prefix pixelplay-launcher/frontend
      - name: Backend regression tests
        working-directory: pixelplay-launcher
        run: go test ./internal/updater ./internal/horizon ./internal/unified
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Build and smoke test macOS
        if: runner.os == 'macOS'
        working-directory: pixelplay-launcher
        run: |
          wails build -platform '${{ matrix.platform }}' -s -skipbindings
          APP=build/bin/pixelplay-launcher.app
          test -f "$APP/Contents/MacOS/pixelplay-launcher"
          "$APP/Contents/MacOS/pixelplay-launcher" --version | tee /tmp/pixel-version
          grep -Fx '7.0.2' /tmp/pixel-version
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p ../dist
          ditto -c -k --keepParent "$APP" '../dist/PixelPlay-7.0.2-${{ matrix.artifact }}.zip'
      - name: Build and smoke test Windows
        if: runner.os == 'Windows'
        working-directory: pixelplay-launcher
        run: |
          export PATH="/c/mingw64/bin:/c/Program Files (x86)/NSIS:$PATH"
          gcc --version
          mkdir -p build/windows/installer/tmp
          curl --fail --location --retry 3 https://aka.ms/vs/17/release/vc_redist.x64.exe -o build/windows/installer/tmp/vc_redist.x64.exe
          wails build -platform windows/amd64 -s -skipbindings -webview2 embed -nsis -installscope user
          ./build/bin/pixelplay-launcher.exe --version > startup-version.txt
          grep -Fx '7.0.2' startup-version.txt
          mkdir -p ../dist
          cp build/bin/*.exe ../dist/
      - uses: actions/upload-artifact@v4
        with:
          name: pixelplay-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
